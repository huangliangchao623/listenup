name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # 用 Windows 跑：
    #   · 项目里 FFMPEG 路径写死成 tools/bin/ffmpeg.exe
    #   · PyAV / ctranslate2 在三个平台行为略有差异，开发者主要用 Windows
    # Linux 上要额外做符号链接，为了 CI 简单先只覆盖主力平台
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
        shell: pwsh

      - name: 准备 ffmpeg
        # 测试会真的调 ffmpeg 切音频（只是 ASR 结果用注入的假数据），
        # 所以必须有一个可用的二进制放在 tools/bin/ffmpeg.exe
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          New-Item -ItemType Directory -Force -Path tools/bin | Out-Null
          $exe  = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe  | Select-Object -First 1).FullName
          $probe = (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          Copy-Item $exe   tools/bin/ffmpeg.exe
          Copy-Item $probe tools/bin/ffprobe.exe
          & tools/bin/ffmpeg.exe -version | Select-Object -First 1
        shell: pwsh

      - name: 语法检查
        run: |
          python -m compileall -q app/listenup app/run.py app/console.py app/desktop.py
          node --check app/web/app.js
        shell: pwsh

      - name: 运行单元测试
        # TTS 测试在没有离线语音模型时会自动 skip，不需要额外准备
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s app/tests -v
        shell: pwsh

  sentences-only:
    # 切句算法是纯逻辑，不依赖任何第三方包。
    # 单独跑一遍作为快速反馈：即使上面那个重任务因为环境问题失败，
    # 这一项也能证明核心算法是好的。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 只测切句算法
        # working-directory 已经是 app/，所以路径里不要再带 app/ 前缀
        run: |
          python -m unittest tests.test_sentences -v
        working-directory: app
        env:
          PYTHONPATH: .
